spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ecomerce-order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1

            - id: ecomerce-product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=1

            - id: ecomerce-inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**
              filters:
                - StripPrefix=1


            - id: ecomerce-user-service
              uri: lb://SECURITY-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


jwt:
  secret: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
