spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
           - id: ecomerce-user-service
             uri: lb://user-service
             predicates:
              - Path=/user/**
             filters:
              - StripPrefix=1

           - id: ecomerce-product-service
             uri: lb://product-service
             predicates:
             - Path=/product/**
             filters:
             - StripPrefix=1

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8082/eureka




